school:
  name: "Sample High School"
  academic_year: "2026-27"

schedule:
  days:
    - MONDAY
    - TUESDAY
    - WEDNESDAY
    - THURSDAY
    - FRIDAY
    - SATURDAY
  periods_per_day: 8
  recess_after_period: 4
  period_timings:
    1: "07:10 - 07:50"
    2: "07:50 - 08:25"
    3: "08:25 - 09:00"
    4: "09:00 - 09:30"
    recess: "09:30 - 09:50"
    5: "09:50 - 10:25"
    6: "10:25 - 11:00"
    7: "11:00 - 11:35"
    8: "11:35 - 12:10"

subjects:
  core_academic:
    - "ENGLISH"
    - "MARATHI"
    - "HINDI"
    - "SANSKRIT"
    - "MATHS"
    - "ALGEBRA"
    - "GEOMETRY"
    - "SCIENCE"
    - "SCIENCE I"
    - "SCIENCE II"
    - "EVS I"
    - "EVS II"
    - "HISTORY"
    - "GEOGRAPHY"
  activity:
    - "P.E"
    - "P.E."
    - "COMPUTER"
    - "ART"
    - "CRAFT"
    - "MUSIC"
    - "LIBRARY"
    - "SCOUT & GUIDE"
    - "SELF DEFENCE"
    - "CCA"
  special_curricular:
    - "VALUE EDUCATION"
    - "WATER SECURITY"
  lab_resources:
    "COMPUTER": "COMPUTER_LAB"

solver:
  time_limit_seconds: 60
  num_search_workers: 8
  random_seed: 42
  log_search_progress: false

constraints:
  constraints_csv_path: "sample-data/sample-constraints.csv"
  weights:
    S1: 100
    S2: 80
    S3: 50
    S4: 40
    S5: 30
    S6: 20

paths:
  standardwise_file: "sample-data/sample-standardwise-allotment.xlsx"
  teacherwise_file: "sample-data/sample-teacherwise-allotment.xlsx"
  class_teachers_file: "sample-data/sample-classteacher-list.xlsx"
  constraints_file: "sample-data/sample-constraints.csv"
  output_dir: "output"
